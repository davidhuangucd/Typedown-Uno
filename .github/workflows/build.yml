name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    name: Check generated assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two ways the translations go quietly wrong, both of which have happened: a string added to Loc.cs
      # but never to tables/en.json, which no language can then carry, and a Locales/*.cs edited by hand,
      # which the next run of the generator throws away. --check catches both without writing anything.
      - run: python3 Tools/Translations/generate.py --check
      - run: bash packaging/check-app-assets.sh

  reliability:
    name: Reliability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet run --project Tests/Typedown.Uno.ReliabilityTests/Typedown.Uno.ReliabilityTests.csproj -c Release

  build:
    name: ${{ matrix.name }}
    needs: [checks, reliability]
    # A release pushes the version bump to main and then the tag, which used to start the same build twice.
    # The tag run is the one that publishes, so the branch run for a version commit is skipped.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Version ')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04,   rid: linux-x64,  archive: tar }
          - { name: win-x64,     os: windows-latest, rid: win-x64,    archive: zip }
          - { name: osx-arm64,   os: macos-latest,   rid: osx-arm64,  archive: tar }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Linux native dependencies (build only; users need libgtk-3-0 + libwebkit2gtk-4.1-0)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0 >/dev/null

      - name: Publish (self-contained)
        shell: bash
        run: |
          dotnet publish Typedown.Uno/Typedown.Uno.csproj -f net9.0-desktop -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=false -o publish/Typedown-${{ matrix.name }}
          # typedownctl and the automation documents beside the app (the local automation API is Linux/macOS here;
          # on Windows the native edition serves it).
          if [ "${{ runner.os }}" != "Windows" ]; then
            ./packaging/add-cli.sh publish/Typedown-${{ matrix.name }} ${{ matrix.rid }}
          fi

      - name: macOS app bundle (Typedown.app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # a tag like v1.2.0; a pull request's ref (2/merge) is not a version and would put a / in the file names
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?$ ]] || version="0.0.0-$(date +%Y%m%d)"
          ./packaging/build-macos-app.sh "publish/Typedown-${{ matrix.name }}" "$version" "publish/app-${{ matrix.name }}"
          rm -rf "publish/Typedown-${{ matrix.name }}"
          mkdir "publish/Typedown-${{ matrix.name }}"
          mv "publish/app-${{ matrix.name }}/Typedown.app" "publish/Typedown-${{ matrix.name }}/"

      - name: Archive
        shell: bash
        run: |
          mkdir -p dist
          cd publish
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../dist/Typedown-${{ matrix.name }}.zip" "Typedown-${{ matrix.name }}" >/dev/null
          else
            tar -czf "../dist/Typedown-${{ matrix.name }}.tar.gz" "Typedown-${{ matrix.name }}"
          fi
          ls -la ../dist

      - name: Linux packages (deb, AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq fakeroot >/dev/null
          # appimagetool is a single binary; skipped automatically when the download fails
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            && chmod +x /tmp/appimagetool && sudo mv /tmp/appimagetool /usr/local/bin/appimagetool || true
          # appimagetool is itself an AppImage and the runners have no libfuse2; this makes it self-extract.
          export APPIMAGE_EXTRACT_AND_RUN=1
          version="${GITHUB_REF_NAME#v}"
          # a tag like v1.2.0; a pull request's ref (2/merge) is not a version and would put a / in the file names
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?$ ]] || version="0.0.0-$(date +%Y%m%d)"
          ./packaging/build-linux-packages.sh "publish/Typedown-${{ matrix.name }}" "$version" dist

      - uses: actions/upload-artifact@v4
        with:
          name: Typedown-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}")
          if [ "$(jq -r .object.type <<<"$ref")" = "tag" ]; then
            gh api "repos/${{ github.repository }}/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message | sed '1{/^Typedown /d}' > notes.md
            printf '\n---\n\n' >> notes.md
          else
            : > notes.md
          fi
          cat >> notes.md <<'MD'
          | File | Platform |
          |---|---|
          | `typedown_*_amd64.deb` | Debian / Ubuntu x64 — `sudo dpkg -i typedown_*.deb`, pulls `libgtk-3-0` and `libwebkit2gtk-4.1-0` |
          | `Typedown-*-x86_64.AppImage` | Any Linux x64 — `chmod +x` and run (same two system libraries required) |
          | `Typedown-linux-x64*.tar.gz` | Linux x64 portable — extract and run `./Typedown.Uno` |
          | `Typedown-win-x64.zip` | Windows 10/11 x64 — needs the WebView2 runtime (present on Windows 11) |
          | `Typedown-osx-arm64.tar.gz` | macOS Apple Silicon — extract, move `Typedown.app` to Applications; unsigned: right-click → Open the first time |

          The .NET runtime is bundled; nothing else to install. Settings, session and `debug.log` live in
          `~/.local/share/Typedown.Uno/` (`%LOCALAPPDATA%\Typedown.Uno\` on Windows).
          MD
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Typedown Uno ${{ github.ref_name }}" --notes-file notes.md
            gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Typedown Uno ${{ github.ref_name }}" --notes-file notes.md
          fi
